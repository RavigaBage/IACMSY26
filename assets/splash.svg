<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
  <defs>
    <clipPath id="splashCircleClip">
      <circle cx="1366" cy="1200" r="420" />
    </clipPath>
    <clipPath id="splashLeftHalf">
      <rect x="0" y="0" width="1366" height="2732" />
    </clipPath>
    <clipPath id="splashRightHalf">
      <rect x="1366" y="0" width="1366" height="2732" />
    </clipPath>
    <linearGradient id="splashBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="splashShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="2732" height="2732" fill="url(#splashBg)" />

  <!-- Dual Flag Circular Shield -->
  <circle cx="1366" cy="1200" r="424" fill="#ffffff" filter="url(#splashShadow)" />

  <g clip-path="url(#splashCircleClip)">
    <!-- LEFT: GHANA FLAG -->
    <g clip-path="url(#splashLeftHalf)">
      <rect x="946" y="780" width="840" height="280" fill="#CE1126" />
      <rect x="946" y="1060" width="840" height="280" fill="#FCD116" />
      <rect x="946" y="1340" width="840" height="280" fill="#006B3F" />
      <polygon points="1210,1110 1230,1170 1290,1170 1240,1210 1260,1270 1210,1230 1160,1270 1180,1210 1130,1170 1190,1170" fill="#000000" />
    </g>

    <!-- RIGHT: SOUTH KOREA FLAG -->
    <g clip-path="url(#splashRightHalf)">
      <rect x="1366" y="780" width="420" height="840" fill="#FFFFFF" />
      <g transform="translate(1520, 1200)">
        <path d="M 0,-120 A 120 120 0 0 1 0,120 A 60 60 0 0 1 0,0 A 60 60 0 0 0 0,-120" fill="#0047A0" />
        <path d="M 0,120 A 120 120 0 0 1 0,-120 A 60 60 0 0 1 0,0 A 60 60 0 0 0 0,120" fill="#CD2E3A" />
      </g>
      <!-- Trigrams -->
      <g transform="translate(1680, 1020) rotate(45)">
        <rect x="-30" y="-16" width="60" height="7" rx="2" fill="#000000" />
        <rect x="-30" y="-4" width="60" height="7" rx="2" fill="#000000" />
        <rect x="-30" y="8" width="60" height="7" rx="2" fill="#000000" />
      </g>
      <g transform="translate(1680, 1380) rotate(-45)">
        <rect x="-30" y="-16" width="27" height="7" rx="2" fill="#000000" />
        <rect x="3" y="-16" width="27" height="7" rx="2" fill="#000000" />
        <rect x="-30" y="-4" width="27" height="7" rx="2" fill="#000000" />
        <rect x="3" y="-4" width="27" height="7" rx="2" fill="#000000" />
        <rect x="-30" y="8" width="27" height="7" rx="2" fill="#000000" />
        <rect x="3" y="8" width="27" height="7" rx="2" fill="#000000" />
      </g>
    </g>

    <!-- Dividing white bar -->
    <line x1="1366" y1="780" x2="1366" y2="1620" stroke="#FFFFFF" stroke-width="10" />
  </g>

  <!-- Central Crest Overlay -->
  <circle cx="1366" cy="1200" r="150" fill="#18181b" stroke="#FCD116" stroke-width="10" filter="url(#splashShadow)" />
  <text x="1366" y="1215" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="95" fill="#FCD116" text-anchor="middle" letter-spacing="4">IAC</text>
  <text x="1366" y="1270" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">MOBILE</text>

  <!-- Splash Title & Subtitles -->
  <text x="1366" y="1800" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="80" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">IAC MOBILE</text>
  <text x="1366" y="1870" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="36" fill="#A1A1AA" text-anchor="middle" letter-spacing="2">Information Access Center</text>
  <text x="1366" y="1930" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="28" fill="#FCD116" text-anchor="middle" letter-spacing="1">Ghana · South Korea Cooperation</text>
</svg>
