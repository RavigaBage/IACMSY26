<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sign In · IAC Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #F8FAFC;
    --surface: #FFFFFF;
    --surface-subtle: #FDFBF7;
    --border: #E2E8F0;
    --border-subtle: #F1F5F9;
    --border-focus: #F59E0B;
    --text-primary: #0F172A;
    --text-secondary: #475569;
    --text-muted: #94A3B8;

    /* White & Yellow Theme Tokens */
    --yellow-50: #FFFBEB;
    --yellow-100: #FEF3C7;
    --yellow-200: #FDE68A;
    --yellow-300: #FCD34D;
    --yellow-400: #FBBF24;
    --yellow-500: #F59E0B;
    --yellow-600: #D97706;
    --yellow-700: #B45309;

    --primary: #F59E0B;
    --primary-hover: #D97706;
    --primary-dark-text: #0F172A;
    --primary-light: #FEF3C7;
    --warning: #D97706;
    --danger: #DC2626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg-page);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .app-shell {
    width: 100%;
    max-width: 440px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 28px;
    box-shadow: 0 12px 36px -10px rgba(15, 23, 42, 0.08);
    overflow: hidden;
    padding: 34px 28px;
    position: relative;
  }
  @media (max-width: 480px) {
    body { padding: 0; background: var(--surface); justify-content: flex-start; }
    .app-shell { border: none; border-radius: 0; box-shadow: none; padding: 28px 20px; }
  }
  .brand-header {
    text-align: center;
    margin-bottom: 24px;
  }
  .brand-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--yellow-100);
    color: var(--yellow-700);
    border: 1px solid var(--yellow-200);
    padding: 6px 14px;
    border-radius: 9999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .brand-badge::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--yellow-500);
  }
  .app-title {
    font-size: 26px;
    font-weight: 800;
    color: var(--text-primary);
    letter-spacing: -0.03em;
    margin: 0 0 6px;
  }
  .app-title span {
    color: var(--yellow-600);
  }
  .app-subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0;
  }
  .tab-switch {
    display: flex;
    background: var(--surface-subtle);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 20px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tab-btn.active {
    background: var(--surface);
    color: var(--text-primary);
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
    border: 1px solid var(--border);
  }
  .error-banner {
    background: #FEF2F2;
    color: #991B1B;
    border: 1px solid #FCA5A5;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.45;
    margin-bottom: 18px;
    display: none;
    text-align: left;
    box-shadow: 0 1px 3px rgba(220, 38, 38, 0.08);
  }
  .form-group {
    margin-bottom: 16px;
    text-align: left;
  }
  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 6px;
  }
  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }
  .form-input {
    width: 100%;
    padding: 12px 14px;
    font-size: 14px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: #FFFFFF;
    color: var(--text-primary);
    font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .form-input:focus {
    outline: none;
    border-color: var(--yellow-500);
    box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.18);
  }
  .toggle-pwd-btn {
    position: absolute;
    right: 10px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 6px;
    user-select: none;
  }
  .toggle-pwd-btn:hover {
    color: var(--text-primary);
  }
  .btn-submit {
    width: 100%;
    padding: 14px;
    font-size: 14px;
    font-weight: 700;
    background: var(--yellow-400);
    color: var(--primary-dark-text);
    border: 1px solid var(--yellow-500);
    border-radius: 14px;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s, box-shadow 0.15s;
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 14px rgba(245, 158, 11, 0.25);
  }
  .btn-submit:hover {
    background: var(--yellow-500);
  }
  .btn-submit:active {
    transform: scale(0.99);
  }
  .btn-submit:disabled {
    opacity: 0.65;
    cursor: not-allowed;
  }
  .quick-demo-card {
    margin-top: 22px;
    background: var(--yellow-50);
    border: 1px solid var(--yellow-200);
    border-radius: 16px;
    padding: 14px 16px;
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .demo-avatar {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    object-fit: cover;
    border: 2px solid var(--yellow-300);
  }
  .demo-info h4 {
    margin: 0 0 2px;
    font-size: 13px;
    font-weight: 800;
    color: var(--text-primary);
  }
  .demo-info p {
    margin: 0;
    font-size: 11px;
    color: var(--yellow-700);
    font-weight: 600;
  }
  .btn-quick-login {
    background: var(--surface);
    color: var(--yellow-700);
    border: 1px solid var(--yellow-300);
    font-size: 11px;
    font-weight: 700;
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .btn-quick-login:hover {
    background: var(--yellow-400);
    color: var(--primary-dark-text);
  }
  .footer-links {
    margin-top: 24px;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
  }
  .footer-links a {
    color: var(--yellow-700);
    text-decoration: none;
    font-weight: 600;
  }
  .footer-links a:hover {
    text-decoration: underline;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="app-shell">
  <div class="brand-header">
    <div class="brand-badge">Information Access Center</div>
    <h1 class="app-title">IAC <span>Mobile</span></h1>
    <p class="app-subtitle">Lounge check-in, room booking, & facility help</p>
  </div>

  <div class="tab-switch">
    <button type="button" class="tab-btn active" id="tabLoginBtn" onclick="switchMode('login')">Sign In</button>
    <button type="button" class="tab-btn" id="tabRegisterBtn" onclick="switchMode('register')">Register</button>
  </div>

  <div class="error-banner" id="errorBanner" role="alert"></div>

  <!-- LOGIN FORM -->
  <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
    <div class="form-group">
      <label class="form-label" for="loginEmail">Email Address</label>
      <input type="email" id="loginEmail" class="form-input" placeholder="alex.vance@mit.edu" required autocomplete="email" value="alex.vance@mit.edu">
    </div>
    <div class="form-group">
      <label class="form-label" for="loginPass">Password</label>
      <div class="input-wrapper">
        <input type="password" id="loginPass" class="form-input" placeholder="••••••••" required autocomplete="current-password" value="Password123!">
        <button type="button" class="toggle-pwd-btn" onclick="togglePwdVisibility('loginPass', this)">Show</button>
      </div>
    </div>
    <button type="submit" class="btn-submit" id="btnLoginSubmit">
      <span>Sign In to Mobile System</span>
    </button>
  </form>

  <!-- REGISTER FORM -->
  <form id="registerForm" class="hidden" onsubmit="handleRegister(event)" novalidate>
    <div class="form-group">
      <label class="form-label" for="regName">Full Name</label>
      <input type="text" id="regName" class="form-input" placeholder="Alex Vance" required autocomplete="name">
    </div>
    <div class="form-group">
      <label class="form-label" for="regEmail">Email Address</label>
      <input type="email" id="regEmail" class="form-input" placeholder="alex.vance@mit.edu" required autocomplete="email">
    </div>
    <div class="form-group">
      <label class="form-label" for="regPhone">Phone Number</label>
      <input type="tel" id="regPhone" class="form-input" placeholder="+1 (555) 0192" autocomplete="tel">
    </div>
    <div class="form-group">
      <label class="form-label" for="regId">Student / Member ID</label>
      <input type="text" id="regId" class="form-input" placeholder="IAC-USR-88402">
    </div>
    <div class="form-group">
      <label class="form-label" for="regPass">Password (min. 6 characters)</label>
      <div class="input-wrapper">
        <input type="password" id="regPass" class="form-input" placeholder="Create secure password" minlength="6" required autocomplete="new-password">
        <button type="button" class="toggle-pwd-btn" onclick="togglePwdVisibility('regPass', this)">Show</button>
      </div>
    </div>
    <button type="submit" class="btn-submit" id="btnRegSubmit">
      <span>Create Member Account</span>
    </button>
  </form>

  <!-- QUICK ACCESS 1-TAP LOGIN FOR DEMO -->
  <div class="quick-demo-card">
    <img src="assets/avatar.jpg" alt="Alex Vance" class="demo-avatar" onerror="this.src='/frontend/public/assets/avatar.jpg'; this.onerror=null;">
    <div class="demo-info">
      <h4>Alex Vance</h4>
      <p>Tier 1 • Spatial Dynamics Lab</p>
    </div>
    <button type="button" class="btn-quick-login" onclick="quickLoginAlex()">
      Instant Login ⚡
    </button>
  </div>

  <div class="footer-links">
    <span>IAC Remote Management System</span> · <a href="/">Desktop Dashboard</a>
  </div>
</div>

<script>
let currentMode = 'login';

function switchMode(mode) {
  currentMode = mode;
  hideError();
  if (mode === 'login') {
    document.getElementById('tabLoginBtn').classList.add('active');
    document.getElementById('tabRegisterBtn').classList.remove('active');
    document.getElementById('loginForm').classList.remove('hidden');
    document.getElementById('registerForm').classList.add('hidden');
  } else {
    document.getElementById('tabRegisterBtn').classList.add('active');
    document.getElementById('tabLoginBtn').classList.remove('active');
    document.getElementById('registerForm').classList.remove('hidden');
    document.getElementById('loginForm').classList.add('hidden');
  }
}

function togglePwdVisibility(inputId, btn) {
  const input = document.getElementById(inputId);
  if (!input) return;
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = 'Hide';
  } else {
    input.type = 'password';
    btn.textContent = 'Show';
  }
}

function showError(msg) {
  const b = document.getElementById('errorBanner');
  if (!b) return;
  if (!msg) {
    b.style.display = 'none';
    return;
  }
  let cleanMsg = String(msg);
  // Intercept and sanitize any accidental HTML tags or raw SyntaxError text
  if (cleanMsg.includes('<body') || cleanMsg.includes('<!DOCTYPE') || cleanMsg.includes('Unexpected token') || cleanMsg.includes('SyntaxError')) {
    cleanMsg = 'Unable to complete sign in. Please verify your credentials or server connection.';
  }
  b.innerHTML = `<span style="display:inline-block; margin-right:6px;">⚠️</span> ${cleanMsg}`;
  b.style.display = 'block';
}

function hideError() {
  const b = document.getElementById('errorBanner');
  if (b) b.style.display = 'none';
}

// Safely parse JSON or text response to prevent "Unexpected token < <body>" errors
async function parseApiResponse(res) {
  const contentType = res.headers.get('content-type') || '';
  if (contentType.includes('application/json')) {
    try {
      return await res.json();
    } catch (e) {
      console.warn('Failed to parse json body:', e);
      return null;
    }
  }
  try {
    const text = await res.text();
    if (text.trim().startsWith('{') || text.trim().startsWith('[')) {
      return JSON.parse(text);
    }
  } catch (e) {}
  return null;
}

function saveAuthAndRedirect(data) {
  const user = data.user || {};
  localStorage.setItem('iac_mobile_access_token', data.accessToken || 'session_active');
  if (data.refreshToken) {
    localStorage.setItem('iac_mobile_refresh_token', data.refreshToken);
  }
  localStorage.setItem('iac_mobile_user_id', user.id || user.mobileUserId || 'mob_user_88402');
  localStorage.setItem('iac_mobile_user_name', user.name || 'Alex Vance');
  localStorage.setItem('iac_mobile_user_email', user.email || 'alex.vance@mit.edu');
  localStorage.setItem('iac_mobile_user_phone', user.phoneNumber || '+1 555-0192');
  localStorage.setItem('iac_mobile_user_id_num', user.studentId || 'IAC-USR-88402');
  localStorage.setItem('iac_mobile_user_streak', String(user.streak || 7));
  window.location.href = 'index.html';
}

async function handleLogin(e) {
  e.preventDefault();
  hideError();

  const emailInput = document.getElementById('loginEmail');
  const passInput = document.getElementById('loginPass');
  const email = emailInput.value.trim();
  const password = passInput.value;

  // Client-side validations
  if (!email) {
    showError('Please enter your email address.');
    emailInput.focus();
    return;
  }
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailRegex.test(email)) {
    showError('Please enter a valid email address (e.g. alex.vance@mit.edu).');
    emailInput.focus();
    return;
  }
  if (!password) {
    showError('Please enter your password.');
    passInput.focus();
    return;
  }

  const btn = document.getElementById('btnLoginSubmit');
  btn.disabled = true;
  btn.textContent = 'Authenticating...';

  try {
    const res = await fetch('/api/iac-mobile/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await parseApiResponse(res);

    if (!res.ok) {
      const errMsg = data?.error || data?.message || (res.status === 401 ? 'Invalid email or password' : 'Login failed. Please try again.');
      throw new Error(errMsg);
    }

    if (!data || !data.accessToken) {
      throw new Error('Invalid response received from authentication server.');
    }

    saveAuthAndRedirect(data);
  } catch (err) {
    showError(err.message || 'Login failed. Please check your credentials.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign In to Mobile System';
  }
}

async function handleRegister(e) {
  e.preventDefault();
  hideError();

  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const phoneNumber = document.getElementById('regPhone').value.trim();
  const studentId = document.getElementById('regId').value.trim();
  const password = document.getElementById('regPass').value;

  // Validation
  if (!name) {
    showError('Please enter your full name.');
    return;
  }
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!email || !emailRegex.test(email)) {
    showError('Please enter a valid email address.');
    return;
  }
  if (!password || password.length < 6) {
    showError('Password must be at least 6 characters long.');
    return;
  }

  const btn = document.getElementById('btnRegSubmit');
  btn.disabled = true;
  btn.textContent = 'Creating Account...';

  try {
    const res = await fetch('/api/iac-mobile/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, phoneNumber, studentId, password })
    });

    const data = await parseApiResponse(res);

    if (!res.ok) {
      const errMsg = data?.error || data?.message || 'Registration failed. Please check your input.';
      throw new Error(errMsg);
    }

    if (!data || !data.accessToken) {
      throw new Error('Invalid response from registration service.');
    }

    saveAuthAndRedirect(data);
  } catch (err) {
    showError(err.message || 'Registration failed. Try again.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Create Member Account';
  }
}

// 1-Click Fast Login for Demo
async function quickLoginAlex() {
  hideError();
  const email = 'alex.vance@mit.edu';
  const password = 'Password123!';

  // Try standard login
  try {
    const res = await fetch('/api/iac-mobile/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await parseApiResponse(res);
    if (res.ok && data && data.accessToken) {
      saveAuthAndRedirect(data);
      return;
    }
  } catch (e) {}

  // If needed, register demo user
  try {
    const regRes = await fetch('/api/iac-mobile/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: 'Alex Vance',
        email,
        phoneNumber: '+1 555-0192',
        studentId: 'IAC-USR-88402',
        password
      })
    });
    const data = await parseApiResponse(regRes);
    if (regRes.ok && data && data.accessToken) {
      saveAuthAndRedirect(data);
      return;
    }
  } catch (e) {}

  // Instant fallback demo session
  saveAuthAndRedirect({
    accessToken: 'demo_token_alex_vance',
    user: {
      id: 'mob_user_88402',
      name: 'Alex Vance',
      email: 'alex.vance@mit.edu',
      phoneNumber: '+1 555-0192',
      studentId: 'IAC-USR-88402',
      streak: 7,
      totalCheckins: 14
    }
  });
}

// Auto-redirect if already signed in
if (localStorage.getItem('iac_mobile_access_token')) {
  window.location.href = 'index.html';
}
</script>
</body>
</html>
